---
- name: Deploy Web Page
  hosts: webservers
  become: true
  tasks:
    - name: Copy website
      ansible.builtin.copy:
        content: |
          <!DOCTYPE html>
          <html>
          <body>
            <h1>Welcome to Ansible Deployment</h1>
            <p>DevSecOps Lab</p>
          </body>
          </html>
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: "0644"
